name: Security (frontend)

# Manual only for now (Actions > this workflow > Run workflow).
# Uncomment to also run on PRs and pushes to main.
on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# In the app's own repo: APP_DIR '.', and app_dir '.' in the trivy job at the bottom.
env:
  APP_DIR: apps/frontend
  SONAR_PROJECT_KEY: BlagoTcherecharov_security-scan-pipeline_frontend

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar's new-code detection

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Cache Sonar packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Dependencies let Sonar resolve TypeScript types (no build, no tests)
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --ignore-scripts

      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ env.APP_DIR }}
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.exclusions=**/node_modules/**,**/dist/**

  coverity:
    runs-on: ubuntu-latest
    env:
      COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
      COVERITY_EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
      COVERITY_PROJECT: ${{ secrets.COVERITY_SCAN_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Coverity tool is ~1 GB: cache it, keyed on the md5 of the latest release
      - name: Get Coverity tool version
        id: covver
        run: |
          md5=$(curl -fsS https://scan.coverity.com/download/linux64 \
            --data-urlencode "token=$COVERITY_TOKEN" \
            --data-urlencode "project=$COVERITY_PROJECT" \
            --data-urlencode "md5=1")
          echo "md5=$md5" >> "$GITHUB_OUTPUT"

      - name: Cache Coverity tool
        id: covcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cov-analysis
          key: coverity-${{ runner.os }}-${{ steps.covver.outputs.md5 }}

      - name: Download Coverity tool
        if: steps.covcache.outputs.cache-hit != 'true'
        run: |
          curl -fsS https://scan.coverity.com/download/linux64 \
            --data-urlencode "token=$COVERITY_TOKEN" \
            --data-urlencode "project=$COVERITY_PROJECT" \
            -o cov-analysis.tgz
          mkdir cov-analysis
          tar xzf cov-analysis.tgz --strip-components=1 -C cov-analysis
          rm cov-analysis.tgz

      # TEMPORARY: find out how this Coverity Scan tool captures JS/TS without a build.
      # Prints the tool's commands and cov-build's capture-related options, then stops
      # (exit 1) so nothing is uploaded and no Coverity build quota is used.
      - name: Inspect Coverity tool
        run: |
          echo "== version"; cov-analysis/bin/cov-build --ident
          echo "== commands in bin/ (capture/emit/script related)"
          find cov-analysis/bin -maxdepth 1 -type f -printf '%f\n' | grep -iE 'capture|emit|java|script|node|ts|js' || true
          echo "== all commands in bin/"
          find cov-analysis/bin -maxdepth 1 -type f -printf '%f ' ; echo
          echo "== cov-build options mentioning capture/search/command/script/language"
          cov-analysis/bin/cov-build --help 2>&1 | grep -iE -B1 -A2 'capture|search|no-?command|script|javascript|typescript|language' | head -80 || true
          echo "== config templates (shows supported languages)"
          find cov-analysis/config/templates -maxdepth 1 -printf '%f ' 2>/dev/null; echo
          exit 1

      - name: Upload to Coverity Scan
        run: |
          tar czf cov-int.tgz cov-int
          curl -fsS "https://scan.coverity.com/builds?project=$(jq -rn --arg p "$COVERITY_PROJECT" '$p|@uri')" \
            --form-string "token=$COVERITY_TOKEN" \
            --form-string "email=$COVERITY_EMAIL" \
            --form "file=@cov-int.tgz" \
            --form-string "version=$GITHUB_SHA" \
            --form-string "description=GitHub Actions run $GITHUB_RUN_ID"

  trivy:
    uses: ./.github/workflows/trivy.yml
    with:
      app_dir: apps/frontend # same as APP_DIR
