name: Security (frontend)

# Manual only for now (Actions > this workflow > Run workflow).
# Uncomment to also run on PRs and pushes to main.
on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# npm-specific setup is written here as plain steps; the scanner actions are build-tool agnostic. JS, TS or both.
# In the app's own repo: APP_DIR '.'.
env:
  APP_DIR: apps/frontend

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar's new-code detection

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies # lets Sonar resolve TypeScript types (no build, no tests)
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --ignore-scripts

      - uses: ./.github/actions/sonar
        with:
          app_dir: ${{ env.APP_DIR }}
          project_key: BlagoTcherecharov_security-scan-pipeline_frontend
          organization: ${{ secrets.SONAR_ORGANIZATION }}
          token: ${{ secrets.SONAR_TOKEN }}
          args: -Dsonar.exclusions=**/node_modules/**,**/dist/**

  coverity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # no setup and no build_command: Coverity reads the JS/TS source directly
      - uses: ./.github/actions/coverity
        with:
          app_dir: ${{ env.APP_DIR }}
          token: ${{ secrets.COVERITY_SCAN_TOKEN }}
          email: ${{ secrets.COVERITY_SCAN_EMAIL }}
          project: ${{ secrets.COVERITY_SCAN_PROJECT }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/trivy
        with:
          app_dir: ${{ env.APP_DIR }}
