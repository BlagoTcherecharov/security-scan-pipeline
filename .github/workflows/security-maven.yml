name: Security (maven)

# Manual only for now (Actions > this workflow > Run workflow).
# Uncomment to also run on PRs and pushes to main.
on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Maven-specific setup is written here as plain steps; the scanner actions are build-tool agnostic.
# In the app's own repo: APP_DIR '.'.
env:
  APP_DIR: apps/maven-app

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar's new-code detection

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile (no tests)
        working-directory: ${{ env.APP_DIR }}
        run: mvn -B -DskipTests compile

      - uses: ./.github/actions/sonar
        with:
          app_dir: ${{ env.APP_DIR }}
          project_key: BlagoTcherecharov_security-scan-pipeline
          organization: ${{ secrets.SONAR_ORGANIZATION }}
          token: ${{ secrets.SONAR_TOKEN }}
          args: >
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.libraries=/home/runner/.m2/repository/**/*.jar

  coverity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: ./.github/actions/coverity
        with:
          app_dir: ${{ env.APP_DIR }}
          build_command: mvn -B -DskipTests clean package
          token: ${{ secrets.COVERITY_SCAN_TOKEN }}
          email: ${{ secrets.COVERITY_SCAN_EMAIL }}
          project: ${{ secrets.COVERITY_SCAN_PROJECT }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/trivy
        with:
          app_dir: ${{ env.APP_DIR }}
