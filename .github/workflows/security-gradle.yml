name: Security (gradle)

# Manual only for now (Actions > this workflow > Run workflow).
# Uncomment to also run on PRs and pushes to main.
on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# In the app's own repo: APP_DIR '.', and app_dir '.' in the trivy job at the bottom.
env:
  APP_DIR: apps/gradle-app
  SONAR_PROJECT_KEY: BlagoTcherecharov_security-scan-pipeline_gradle-app

jobs:
  sonar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar's new-code detection

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache Sonar packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Needs plugins { id("org.sonarqube") } in build.gradle.kts
      - name: Build and analyze (no tests)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          ./gradlew build sonar -x test --no-daemon \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.qualitygate.wait=true

  coverity:
    runs-on: ubuntu-latest
    env:
      COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
      COVERITY_EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
      COVERITY_PROJECT: ${{ secrets.COVERITY_SCAN_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The Coverity tool is ~1 GB: cache it, keyed on the md5 of the latest release
      - name: Get Coverity tool version
        id: covver
        run: |
          md5=$(curl -fsS https://scan.coverity.com/download/linux64 \
            --data-urlencode "token=$COVERITY_TOKEN" \
            --data-urlencode "project=$COVERITY_PROJECT" \
            --data-urlencode "md5=1")
          echo "md5=$md5" >> "$GITHUB_OUTPUT"

      - name: Cache Coverity tool
        id: covcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cov-analysis
          key: coverity-${{ runner.os }}-${{ steps.covver.outputs.md5 }}

      - name: Download Coverity tool
        if: steps.covcache.outputs.cache-hit != 'true'
        run: |
          curl -fsS https://scan.coverity.com/download/linux64 \
            --data-urlencode "token=$COVERITY_TOKEN" \
            --data-urlencode "project=$COVERITY_PROJECT" \
            -o cov-analysis.tgz
          mkdir cov-analysis
          tar xzf cov-analysis.tgz --strip-components=1 -C cov-analysis
          rm cov-analysis.tgz

      # --no-daemon / --no-build-cache so cov-build sees every compile; assemble = no tests
      - name: Build with cov-build (no tests)
        working-directory: ${{ env.APP_DIR }}
        run: |
          "$GITHUB_WORKSPACE/cov-analysis/bin/cov-build" --dir "$GITHUB_WORKSPACE/cov-int" \
            ./gradlew --no-daemon --no-build-cache clean assemble

      - name: Upload to Coverity Scan
        run: |
          tar czf cov-int.tgz cov-int
          curl -fsS "https://scan.coverity.com/builds?project=$(jq -rn --arg p "$COVERITY_PROJECT" '$p|@uri')" \
            --form-string "token=$COVERITY_TOKEN" \
            --form-string "email=$COVERITY_EMAIL" \
            --form "file=@cov-int.tgz" \
            --form-string "version=$GITHUB_SHA" \
            --form-string "description=GitHub Actions run $GITHUB_RUN_ID"

  trivy:
    uses: ./.github/workflows/trivy.yml
    with:
      app_dir: apps/gradle-app # same as APP_DIR
