# Reusable Trivy scan: builds the app's Docker image and lists its vulnerabilities
# (base image OS packages from FROM ..., plus dependencies inside the image) in the job log.
name: Trivy

on:
  workflow_call:
    inputs:
      app_dir:
        description: Folder with the Dockerfile ('.' when it's at the repo root)
        type: string
        default: '.'

jobs:
  trivy:
    runs-on: ubuntu-latest
    env:
      IMAGE: local/app:scan # local name for the built image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t "$IMAGE" "${{ inputs.app_dir }}"

      # Report: every finding with its severity (LOW, MEDIUM, HIGH, CRITICAL, UNKNOWN). Never fails.
      - name: Scan image (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: table

      # Gate: fails the job if anything HIGH or CRITICAL is found.
      - name: Block on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
